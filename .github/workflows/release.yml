name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned to the version in rust-toolchain.toml: keep the two in sync.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      # The DOM tests of ui/ (CSD-021 REQ-1). jsdom is a tests-only dev dependency, installed from the lock file.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: npm ci
      - run: npm test

  deny:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The EmbarkStudios action is a Docker action, which macOS runners cannot run.
      - run: cargo install cargo-deny --locked
      - run: cargo deny --all-features check

  build:
    needs: [check, deny]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "varde") | .version')
          conf_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$conf_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and tauri.conf.json ($conf_version)"
            exit 1
          fi

      - name: Check the tagged commit is in main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not in main"
            exit 1
          fi

      # CSD-021 REQ-9: a release for the tag, draft or published, stops the run before the build.
      - name: Check no release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists. Delete it first, it is left unchanged."
            exit 1
          fi

      # CSD-021 REQ-13: no updater key, no build and no release. Only the presence is tested; the
      # values are never printed.
      - name: Check the updater key secrets are set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "The Actions secret $name is not set"
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install tauri-cli --version "^2" --locked

      # The dmg and the signed update archive (CSD-021 REQ-7, REQ-11). The updater key signs the
      # archive; it is a minisign key and has nothing to do with Apple signing.
      - name: Build the dmg and the signed update archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target universal-apple-darwin --bundles dmg,app -- --locked

      # latest.json lists the one universal archive under both Mac platforms (CSD-021 REQ-12).
      - name: Write the update files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle=target/universal-apple-darwin/release/bundle/macos
          archive="Varde_${version}_universal.app.tar.gz"
          mkdir -p update
          cp "$bundle/Varde.app.tar.gz" "update/$archive"
          cp "$bundle/Varde.app.tar.gz.sig" "update/$archive.sig"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}" \
            --rawfile signature "update/$archive.sig" \
            '($signature | rtrimstr("\n")) as $sig
             | { version: $version, notes: "", pub_date: $pub_date,
                 platforms: {
                   "darwin-aarch64": { signature: $sig, url: $url },
                   "darwin-x86_64": { signature: $sig, url: $url } } }' \
            > update/latest.json

      # A draft is invisible to installed apps: publishing it is the rollout (CSD-021 AC-8.2).
      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --title "Varde $GITHUB_REF_NAME" --generate-notes \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            update/*.app.tar.gz update/*.sig update/latest.json
