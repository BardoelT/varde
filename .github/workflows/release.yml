name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "varde") | .version')
          conf_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$conf_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and tauri.conf.json ($conf_version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked

      - run: cargo tauri build --target universal-apple-darwin --bundles dmg

      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --title "Varde $GITHUB_REF_NAME" --generate-notes \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
