name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  # CSD-038 REQ-3: the Rust tests and the DOM tests run on macOS and on Windows; the format
  # check and clippy run on macOS only.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned to the version in rust-toolchain.toml: keep the two in sync.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      # The DOM tests of ui/ (CSD-021 REQ-1). jsdom is a tests-only dev dependency, installed from the lock file.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: npm ci
      - run: npm test

  deny:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The EmbarkStudios action is a Docker action, which macOS runners cannot run.
      - run: cargo install cargo-deny --locked
      - run: cargo deny --all-features check

  # The guards on the tag, the same for every build (CSD-021 REQ-5, REQ-6, REQ-9, REQ-13).
  guard:
    needs: [check, deny]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "varde") | .version')
          conf_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$conf_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and tauri.conf.json ($conf_version)"
            exit 1
          fi

      - name: Check the tagged commit is in main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not in main"
            exit 1
          fi

      # CSD-021 REQ-9: a release for the tag, draft or published, stops the run before the build.
      - name: Check no release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists. Delete it first, it is left unchanged."
            exit 1
          fi

      # CSD-021 REQ-13: no updater key, no build and no release. Only the presence is tested; the
      # values are never printed.
      - name: Check the updater key secrets are set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "The Actions secret $name is not set"
              exit 1
            fi
          done

  build-macos:
    needs: guard
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install tauri-cli --version "^2" --locked

      # The dmg and the signed update archive (CSD-021 REQ-7, REQ-11). The updater key signs the
      # archive; it is a minisign key and has nothing to do with Apple signing.
      - name: Build the dmg and the signed update archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target universal-apple-darwin --bundles dmg,app -- --locked

      - name: Collect the macOS files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle=target/universal-apple-darwin/release/bundle
          archive="Varde_${version}_universal.app.tar.gz"
          mkdir -p files
          cp "$bundle"/dmg/*.dmg files/
          cp "$bundle/macos/Varde.app.tar.gz" "files/$archive"
          cp "$bundle/macos/Varde.app.tar.gz.sig" "files/$archive.sig"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: files/*
          if-no-files-found: error

  # CSD-038 REQ-1, REQ-2, REQ-4: the NSIS setup file with its signature, and a smoke test of it.
  build-windows:
    needs: guard
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install tauri-cli --version "^2" --locked

      # The same updater key signs the setup file, which is also the update file (CSD-038 REQ-2).
      - name: Build the setup file and its signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Collect the Windows files
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          setup="Varde_${version}_x64-setup.exe"
          bundle=target/x86_64-pc-windows-msvc/release/bundle/nsis
          mkdir -p files
          cp "$bundle/$setup" "files/$setup"
          cp "$bundle/$setup.sig" "files/$setup.sig"

      # CSD-038 REQ-4: install silently, start, uninstall silently. A failure stops the release.
      - name: Smoke test the setup file
        shell: pwsh
        run: |
          $setup = (Get-ChildItem files/*-setup.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Varde'
          $exe = Join-Path $dir 'Varde.exe'
          if (-not (Test-Path $exe)) { throw "Varde.exe is not installed in $dir" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Varde.exe exited with code $($app.ExitCode) within 10 seconds" }
          Stop-Process -Id $app.Id -Force
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          # The silent uninstaller hands over to a copy of itself, so wait for the folder to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Test-Path $dir) { throw "$dir still exists after the uninstall" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: files/*
          if-no-files-found: error

  # One draft release from both builds, with one latest.json for the three platforms
  # (CSD-021 REQ-8, REQ-12; CSD-038 REQ-2).
  release:
    needs: [build-macos, build-windows]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: files
          merge-multiple: true

      # latest.json lists the one universal archive under both Mac platforms and the setup file
      # under Windows.
      - name: Write latest.json
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mac="Varde_${version}_universal.app.tar.gz"
          win="Varde_${version}_x64-setup.exe"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$mac" \
            --arg win_url "$base/$win" \
            --rawfile mac_sig "files/$mac.sig" \
            --rawfile win_sig "files/$win.sig" \
            '($mac_sig | rtrimstr("\n")) as $m
             | ($win_sig | rtrimstr("\n")) as $w
             | { version: $version, notes: "", pub_date: $pub_date,
                 platforms: {
                   "darwin-aarch64": { signature: $m, url: $mac_url },
                   "darwin-x86_64": { signature: $m, url: $mac_url },
                   "windows-x86_64": { signature: $w, url: $win_url } } }' \
            > files/latest.json

      # A draft is invisible to installed apps: publishing it is the rollout (CSD-021 AC-8.2).
      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Varde $GITHUB_REF_NAME" --generate-notes \
            files/*
